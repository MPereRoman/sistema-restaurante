name: restaurante

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Mexico_City}
      MARIADB_DATABASE: reconocimiento
      MARIADB_USER: restaurante_app
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en Portainer}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en Portainer}
    volumes:
      - restaurante_db:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: ${TZ:-America/Mexico_City}
      APP_PORT: 3002
      DB_HOST: db
      DB_USER: restaurante_app
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en Portainer}
      DB_NAME: reconocimiento
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en Portainer}
    depends_on:
      db:
        condition: service_started
    volumes:
      - restaurante_uploads:/app/public/uploads
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
  backend:
    internal: true

volumes:
  restaurante_db:
  restaurante_uploads:
